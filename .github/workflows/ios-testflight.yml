# Builds the Pep Prep iPhone app on a GitHub macOS machine and uploads it to TestFlight.
# Runs on every push to main that changes the app, or by hand from the Actions tab.
# Needs four repository secrets (Settings > Secrets and variables > Actions); see native/README.md:
#   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8
name: iPhone app (TestFlight)

on:
  workflow_dispatch:
  # TestFlight builds expire after 90 days; a fresh build on the 1st of each month keeps the app installable
  schedule:
    - cron: '17 9 1 * *'
  push:
    branches: [main]
    paths: ['index.html', 'app.js', 'sw.js', 'manifest.webmanifest', 'icons/**', 'native/**', '.github/workflows/ios-testflight.yml']

concurrency:
  group: ios-testflight
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Check the Apple secrets are set
        id: gate
        run: |
          if [ -z "$APPLE_TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::notice::Apple secrets not set yet, so the iPhone build was skipped. See native/README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Pick Xcode
        if: steps.gate.outputs.ready == 'true'
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_[0-9]*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Copy the web app into the iOS project
        if: steps.gate.outputs.ready == 'true'
        working-directory: native
        run: |
          npm ci
          node copy-web.js
          npx cap sync ios

      - name: Build, sign and upload to TestFlight
        if: steps.gate.outputs.ready == 'true'
        working-directory: native
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_TIMESTAMP: '1'
        run: |
          export APP_VERSION=$(sed -n "s/^const VERSION = 'v\{0,1\}\([0-9.]*\)'.*/\1/p" ../sw.js)
          echo "Version $APP_VERSION, build $BUILD_NUMBER"
          which fastlane || sudo gem install fastlane --no-document
          fastlane testflight_build
